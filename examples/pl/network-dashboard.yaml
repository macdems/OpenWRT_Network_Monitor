# Przykładowy CAŁY dashboard Home Assistant (raw YAML dashboard editor).
# Alternatywa dla wklejenia tylko jednej karty z network-flow-card.yaml.
# Ten plik ma własną kopię karty; nie wklejaj "!include" do edytora UI.
# Wymaga Network Flow Card 4.x i podmiany przykładowych entity_id.
title: Monitor sieci
views:
  - title: Sieć
    path: network
    icon: mdi:lan
    cards:
      - type: custom:network-flow-card
        title: Topologia sieci
        view_mode: hyperbolic
        hyperbolic_layout: auto
        hyperbolic_client_layout: grouped
        hyperbolic_show_details: true
        hyperbolic_details_popup: true
        hyperbolic_show_clients: true
        hyperbolic_show_graphs: true
        hyperbolic_graph_range: 6h
        show_summary: true
        summary_position: top
        summary_items:
          - realtime_download
          - realtime_upload
        enable_animations: true
        flow_line_color: "var(--primary-color)"
        router:
          entity: sensor.router_load_1m
          icon: mdi:router-network
          entities:
            download: sensor.router_wan_rx_bandwidth
            upload: sensor.router_wan_tx_bandwidth
        nodes:
          - name: Punkty dostępowe
            switch: null
            access_points:
              - entity: sensor.ap_alpha_load_1m
                name: AP Alpha
                icon: mdi:access-point-network
                is_primary: true
                entities:
                  connected_devices: sensor.ap_alpha_wifi_clients_total
              - entity: sensor.ap_beta_load_1m
                name: AP Beta
                icon: mdi:access-point-network
                entities:
                  connected_devices: sensor.ap_beta_wifi_clients_total
          - name: Switch LAN (uplink)
            switch:
              entity: binary_sensor.router_lan_port_link
              name: Switch LAN
              icon: mdi:lan
            access_points: []
        individual_devices:
          - entity: device_tracker.phone
            icon: mdi:cellphone
          - entity: device_tracker.workstation
            icon: mdi:laptop
          - entity: device_tracker.printer
            icon: mdi:printer

      - type: heading
        heading: Obciążenie infrastruktury
        icon: mdi:cpu-64-bit
      - type: grid
        columns: 3
        square: false
        cards:
          - type: gauge
            name: Router CPU
            entity: sensor.router_cpu_usage
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 85
          - type: gauge
            name: AP Alpha CPU
            entity: sensor.ap_alpha_cpu_usage
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 85
          - type: gauge
            name: AP Beta CPU
            entity: sensor.ap_beta_cpu_usage
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 85

      - type: heading
        heading: Wykorzystanie łącza WAN
        icon: mdi:chart-line
      - type: history-graph
        title: WAN — pobieranie i wysyłanie (Mbit/s)
        hours_to_show: 6
        refresh_interval: 60
        entities:
          - entity: sensor.router_wan_rx_bandwidth
            name: Download (RX)
          - entity: sensor.router_wan_tx_bandwidth
            name: Upload (TX)

      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Router
            show_header_toggle: false
            entities:
              - entity: sensor.router_load_1m
                name: Load average (1 min)
              - entity: sensor.router_memory_usage
                name: RAM
              - entity: sensor.router_uptime
                name: Uptime
              - entity: binary_sensor.router_wan_link
                name: Łącze WAN
          - type: entities
            title: AP i klienci Wi-Fi
            show_header_toggle: false
            entities:
              - entity: sensor.ap_alpha_wifi_clients_total
                name: AP Alpha — klienci
              - entity: sensor.ap_beta_wifi_clients_total
                name: AP Beta — klienci
              - entity: sensor.ap_alpha_memory_usage
                name: AP Alpha — RAM
              - entity: sensor.ap_beta_memory_usage
                name: AP Beta — RAM

      - type: markdown
        title: Ethernet — podział na sieci logiczne
        content: >-
          {% set groups = state_attr('sensor.ethernet_clients_all', 'by_network') or {} %}
          **Podłączonych urządzeń Ethernet:** {{ states('sensor.ethernet_clients_all') }}

          {% if groups %}
          | Sieć | Klienci |
          |:-----|-------:|
          {% for name, count in groups | dictsort %}
          | {{ name }} | {{ count }} |
          {% endfor %}
          {% else %}
          Brak danych o klientach przewodowych.
          {% endif %}
